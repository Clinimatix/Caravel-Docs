name: Ship's Checklist
on:
  push:
    branches: [feature/ships-checklist-guides]
  pull_request:
    paths:
      - 'site/public/ships-checklist.zip'
      - 'site/learn/ships-checklist/**'
      - 'scripts/checklist-smoke.py'
      - '.github/workflows/checklist.yml'
permissions:
  contents: read
jobs:
  walkthroughs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.403'
      - run: python3 scripts/checklist-smoke.py
